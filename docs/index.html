<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSS Filter Factory</title>
  <style>
    body { font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin: 3rem auto; max-width: 760px; padding: 0 1rem; color: #1f2520; }

  <h1>RSS Filter Factory</h1>
  <p>Public feed filters for republishing smaller RSS streams.</p>
